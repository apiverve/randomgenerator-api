openapi: 3.0.4
info:
  title: Random Data Generator
  description: >-
    Random Data Generator produces random numbers in any range (whole or
    decimal, with or without repeats), dice of any size, coin flips, booleans,
    random strings, UUIDs, and mock names, emails, addresses and dates for
    application testing. Numbers, dice, coins, booleans and strings come from a
    cryptographically secure generator. Paid plans can generate batches up to
    100 items.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/randomgenerator:
    get:
      summary: Random Data Generator
      description: Generate random data of various types
      operationId: randomgenerator
      parameters:
        - name: type
          in: query
          schema:
            type: string
          required: false
          description: The type of random data to generate
          example: number
        - name: count
          in: query
          schema:
            type: integer
          required: false
          description: The number of random data to generate (1 to 100)
          example: 10
        - name: includeAvatar
          in: query
          schema:
            type: boolean
          required: false
          description: Include an AI-generated face avatar (only applies when type=name)
          example: true
        - name: min
          in: query
          schema:
            type: number
          required: false
          description: Smallest number to draw, inclusive (type=number). Defaults to 0
          example: 1
        - name: max
          in: query
          schema:
            type: number
          required: false
          description: Largest number to draw, inclusive (type=number). Defaults to 999999
          example: 100
        - name: decimals
          in: query
          schema:
            type: integer
          required: false
          description: Decimal places for type=number (0 to 10); 0 draws whole numbers
          example: 2
        - name: unique
          in: query
          schema:
            type: boolean
          required: false
          description: Draw without repeats (type=number with whole numbers, or type=dice)
          example: true
        - name: sides
          in: query
          schema:
            type: integer
          required: false
          description: Number of sides on each die for type=dice (2 to 1000)
          example: 20
        - name: length
          in: query
          schema:
            type: integer
          required: false
          description: Length of each value for type=string (1 to 256)
          example: 16
        - name: charset
          in: query
          schema:
            type: string
          required: false
          description: Characters for type=string
          example: alphanumeric
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  type: phone
                  count: 10
                  data:
                    - 967-950-4587
                    - 792-611-7468 x1293
                    - (933) 311-9829
                    - 389.357.7403 x793
                    - 1-621-490-6394
                    - 1-699-562-6833 x8558
                    - 875.226.1530 x641
                    - 744-991-0150 x1974
                    - 1-393-784-0533 x15199
                    - 954-876-6958 x0398
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
